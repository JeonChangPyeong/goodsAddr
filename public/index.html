<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>주소 등록</title>
  <style>
    body {
      background: #f8f8f8;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      width: 360px;
    }
    h2 {
      text-align: center;
      margin-bottom: 30px;
    }
    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 15px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      width: 100%;
      padding: 15px;
      background-color: #715cf0;
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>주소 등록</h2>
    <input type="text" id="nickname" placeholder="닉네임" />
    <input type="text" id="address" placeholder="주소" readonly onclick="findAddress()" />
    <input type="text" id="detailAddress" placeholder="상세주소" />
    <input type="text" id="phone" placeholder="전화번호" />
    <button onclick="submitForm()">등록</button>
  </div>

  <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <script>
    function findAddress() {
      new daum.Postcode({
        oncomplete: function(data) {
          document.getElementById("address").value = data.roadAddress;
        }
      }).open();
    }

    function submitForm() {
      const nickname = document.getElementById("nickname").value.trim();
      const address = document.getElementById("address").value.trim();
      const detailAddress = document.getElementById("detailAddress").value.trim();
      const phone = document.getElementById("phone").value.trim();

      if (!nickname || !address || !phone) {
        alert("모든 필드를 입력해주세요.");
        return;
      }

      fetch("/api/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nickname, address, detailAddress, phone })
      }).then(res => res.json())
        .then(data => {
          if (data.success) {
            alert("등록 완료!");
            location.reload();
          }
        });
    }
  </script>
</body>
</html>
