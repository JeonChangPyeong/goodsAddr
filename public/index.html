<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>주소 등록</title>
</head>
<body>
  <h2>주소 등록</h2>
  <form id="registerForm">
    <input type="text" id="nickname" placeholder="닉네임" required /><br />
    <input type="text" id="address" placeholder="주소" required /><br />
    <input type="text" id="phone" placeholder="전화번호" required /><br />
    <button type="submit">등록</button>
  </form>

  <h3>등록된 사용자 목록</h3>
  <ul id="userList"></ul>

  <script>
    const form = document.getElementById("registerForm");
    const userList = document.getElementById("userList");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const nickname = document.getElementById("nickname").value;
      const address = document.getElementById("address").value;
      const phone = document.getElementById("phone").value;

      const res = await fetch("/api/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nickname, address, phone })
      });
      if (res.ok) {
        alert("등록 완료!");
        loadUsers();
      } else {
        alert("등록 실패");
      }
    });

    async function loadUsers() {
      const res = await fetch("/api/users");
      const users = await res.json();
      userList.innerHTML = "";
      users.forEach(user => {
        const li = document.createElement("li");
        li.textContent = `${user.nickname} - ${user.address} (${user.phone})`;
        userList.appendChild(li);
      });
    }

    loadUsers();
  </script>
</body>
</html>
