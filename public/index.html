<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>주소 등록</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background: #f5f5f5;
      font-family: sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    }
    h2 {
      text-align: center;
      margin-bottom: 30px;
    }
    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      background-color: #6c5ce7;
      color: white;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    button:hover {
      background-color: #5a4bd8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>주소 등록</h2>
    <input type="text" id="nickname" placeholder="닉네임" />
    <input type="text" id="address" placeholder="주소" readonly onclick="openPostcode()" />
    <input type="text" id="detail" placeholder="상세주소" />
    <input type="text" id="phone" placeholder="전화번호" />
    <button onclick="register()">등록</button>
  </div>

  <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <script>
    function openPostcode() {
      new daum.Postcode({
        oncomplete: function(data) {
          const addr = data.roadAddress || data.jibunAddress;
          document.getElementById("address").value = addr;
          document.getElementById("detail").focus(); // 주소 선택 후 상세주소 포커스
        }
      }).open();
    }

    function register() {
      const nickname = document.getElementById("nickname").value.trim();
      const address = document.getElementById("address").value.trim();
      const detail = document.getElementById("detail").value.trim();
      const phone = document.getElementById("phone").value.trim();

      if (!nickname || !address || !detail || !phone) {
        alert("모든 항목을 입력해주세요.");
        return;
      }

      fetch("/api/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nickname, address, detail, phone })
      })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            alert("등록 완료!");
            location.reload();
          } else {
            alert("등록 실패");
          }
        });
    }
  </script>
</body>
</html>
