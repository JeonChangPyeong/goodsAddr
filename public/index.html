<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>주소 등록</title>
  <style>
    body {
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Helvetica Neue', sans-serif;
    }

    .container {
      background: #fff;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      width: 320px;
    }

    .container h1 {
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 32px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 16px;
      font-size: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
    }

    input:focus {
      outline: none;
      border-color: #7a5ef8;
    }

    .button {
      width: 100%;
      padding: 14px;
      background: #7a5ef8;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .button:hover {
      background: #684ae0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>주소 등록</h1>
    <input type="text" id="nickname" placeholder="닉네임" />
    <input type="text" id="address" placeholder="주소" readonly onclick="findAddress()" />
    <input type="text" id="phone" placeholder="전화번호" />
    <button class="button" onclick="register()">등록</button>
  </div>

  <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <script>
    function findAddress() {
      new daum.Postcode({
        oncomplete: function(data) {
          const fullAddr = data.roadAddress || data.jibunAddress || '';
          document.getElementById("address").value = fullAddr;
        },
        useIframe: false  // 모바일 호환 개선
      }).open({
        popupName: 'postcodePopup'
      });
    }

    async function register() {
      const nickname = document.getElementById("nickname").value.trim();
      const address = document.getElementById("address").value.trim();
      const phone = document.getElementById("phone").value.trim();

      if (!nickname || !address || !phone) {
        alert("모든 항목을 입력해주세요.");
        return;
      }

      const res = await fetch("/api/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nickname, address, phone })
      });

      const result = await res.json();
      if (result.success) {
        alert("등록 완료!");
        document.getElementById("nickname").value = "";
        document.getElementById("address").value = "";
        document.getElementById("phone").value = "";
      } else {
        alert("등록 실패: " + (result.error || "알 수 없는 오류"));
      }
    }
  </script>
</body>
</html>
