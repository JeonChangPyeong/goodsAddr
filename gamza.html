<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>관리자 페이지</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background-color: #f6f6f6;
    }
    #loginForm, #userTableContainer {
      max-width: 600px;
      margin: 0 auto;
    }
    #passwordInput {
      padding: 10px;
      width: 100%;
      margin-bottom: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background-color: #fff;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }
    th {
      background-color: #eee;
    }
    #searchInput {
      margin: 10px 0;
      padding: 8px;
      width: 100%;
    }
    #downloadBtn {
      margin-top: 10px;
      padding: 8px;
    }
  </style>
</head>
<body>
  <div id="loginForm">
    <h2>관리자 로그인</h2>
    <input type="password" id="passwordInput" placeholder="비밀번호 입력" />
    <button onclick="checkPassword()">확인</button>
  </div>

  <div id="userTableContainer" style="display:none;">
    <h2>사용자 목록</h2>
    <input type="text" id="searchInput" placeholder="닉네임으로 검색" oninput="renderUsers()" />
    <table>
      <thead>
        <tr>
          <th>닉네임</th>
          <th>주소</th>
          <th>상세주소</th>
          <th>전화번호</th>
        </tr>
      </thead>
      <tbody id="userTableBody"></tbody>
    </table>
    <button id="downloadBtn" onclick="downloadExcel()">엑셀 다운로드</button>
  </div>

  <script>
    let users = [];

    function checkPassword() {
      const password = document.getElementById("passwordInput").value;
      if (password === "gamza") {
        document.getElementById("loginForm").style.display = "none";
        document.getElementById("userTableContainer").style.display = "block";
        loadUsers();
      } else {
        alert("비밀번호가 틀렸습니다.");
      }
    }

    function loadUsers() {
      fetch("/api/users")
        .then(res => res.json())
        .then(data => {
          users = data;
          renderUsers();
        });
    }

    function renderUsers() {
      const search = document.getElementById("searchInput").value.toLowerCase();
      const body = document.getElementById("userTableBody");
      body.innerHTML = "";
      users
        .filter(u => u.nickname.toLowerCase().includes(search))
        .forEach(u => {
          const tr = document.createElement("tr");
          tr.innerHTML = `<td>${u.nickname}</td><td>${u.address}</td><td>${u.detail}</td><td>${u.phone}</td>`;
          body.appendChild(tr);
        });
    }

    function downloadExcel() {
      const headers = ["닉네임", "주소", "상세주소", "전화번호"];
      const rows = users.map(u => [u.nickname, u.address, u.detail, u.phone]);

      let csv = headers.join(",") + "\n" + rows.map(r => r.join(",")).join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);

      const link = document.createElement("a");
      link.href = url;
      link.download = "users.csv";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
